# SPDX-License-Identifier: AGPL-3.0-or-later
# Release pipeline: tag v* (or manual dispatch on a tag) → test → build (tarball + manifest)
# → npm / GitHub Release / Docker / healthz. Secrets are checked at step level (job-level `if` cannot read secrets).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: full unit + integration suite
        run: node --test --test-concurrency=1 "test/*.test.mjs"
      - name: license layering guard
        run: node test/licensing.test.mjs

  build:
    name: build tarball + manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build (tar is preinstalled)
        run: node tools/release/build.mjs --skip-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-fang-release
          path: |
            dist/dsh-fang-*.tgz
            dist/manifest.json
          if-no-files-found: error

  npm:
    name: npm publish (dsh-fang)
    needs: build
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build payload
        run: node tools/release/build.mjs --skip-preflight
      - name: publish when NPM_TOKEN is configured
        id: publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "no NPM_TOKEN secret configured — npm publish skipped"
            exit 0
          fi
          node tools/release/publish-npm.mjs
          echo "published=true" >> "$GITHUB_OUTPUT"

  github-release:
    name: GitHub Release (assets)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fang-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-fang-*.tgz
            dist/manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: docker image (healthz)
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: env.DOCKERHUB_USERNAME != ''
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/dsh-fang:${{ github.ref_name }}
            ${{ env.DOCKERHUB_USERNAME }}/dsh-fang:latest

  healthz:
    name: healthz (npm + GitHub)
    needs: [npm, github-release]
    if: needs.npm.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fang-release
          path: dist
      - run: node tools/release/healthz.mjs --remote
