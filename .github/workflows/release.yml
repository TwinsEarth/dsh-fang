# Release pipeline: tag v* → test → build (tarball + manifest) → npm / GitHub Release / Docker / healthz.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: full unit + integration suite
        run: node --test --test-concurrency=1 "test/*.test.mjs"
      - name: license layering guard
        run: node test/licensing.test.mjs

  build:
    name: build tarball + manifest
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build (tar is preinstalled)
        run: node tools/release/build.mjs --skip-preflight
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-fang-release
          path: |
            dist/dsh-fang-*.tgz
            dist/manifest.json
          if-no-files-found: error

  npm:
    name: npm publish (dsh-fang)
    needs: build
    if: ${{ secrets.NPM_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: build payload
        run: node tools/release/build.mjs --skip-preflight
      - name: publish to registry.npmjs.org
        run: node tools/release/publish-npm.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release (assets)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fang-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dsh-fang-*.tgz
            dist/manifest.json
          generate_release_notes: true
          fail_on_unmatched_files: true

  docker:
    name: docker image (healthz)
    needs: build
    if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-fang:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/dsh-fang:latest

  healthz:
    name: healthz (npm + GitHub)
    needs: [npm, github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: dsh-fang-release
          path: dist
      - run: node tools/release/healthz.mjs --remote
