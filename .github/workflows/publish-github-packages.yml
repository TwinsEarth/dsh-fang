# 发布到 GitHub Packages（npm registry：npm.pkg.github.com）。
# 与 npmjs.com 是两条独立通道；使用仓库自带的 GITHUB_TOKEN（packages: write）。
name: publish-github-packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的 tag（必须已存在，例如 v3.0.9）'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@twinsearth'
      - name: 构建 npm 包（跳过 preflight，tag 已过发布门禁）
        run: node tools/release/build.mjs --skip-preflight
      - name: 发布到 GitHub Packages
        run: npm publish dist/npm/package --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
