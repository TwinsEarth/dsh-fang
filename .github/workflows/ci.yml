# CI: 零第三方依赖 —— 直接跑 node:test；Windows 是产品目标平台（AppContainer/junction/taskkill），
# 因此功能测试跑 windows-latest；许可分层回归与源码扫描这类跨平台检查跑 ubuntu。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: full unit + integration suite
        run: node --test --test-concurrency=1 "test/*.test.mjs"
      - name: offline status (informational, clean runner has no profile)
        run: node tools/fangctl.mjs status

  license:
    name: license layering guard (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: license layering guard
        run: node test/licensing.test.mjs

  e2e:
    name: real dsh e2e (optional, self-hosted windows)
    runs-on: [self-hosted, windows]
    if: ${{ vars.RUN_E2E == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: boot a disposable mother and run a real fork
        run: node tools/e2e.mjs
