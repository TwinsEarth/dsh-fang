# Compatibility: pure-module import + engine checks on both supported Node lines (Linux CI).
name: compat

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compat:
    name: compat (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: module import + engine compatibility
        run: node tools/release/compat.mjs
