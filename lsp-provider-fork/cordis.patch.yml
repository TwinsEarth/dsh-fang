# SPDX-License-Identifier: AGPL-3.0-or-later
# dsh-Fang LSP provider bundle — 路线 B（fork-local）变体，仅用于**加速分身 profile**。
#
# 与母体变体（lsp-provider/）的关系：patch 形状相同（seam + stdio + 可选 tool），
# 但依赖域不同——分身体系是加速核 @twinsearth 3.5.0，必须使用同版本的
# @twinsearth/dsh-lsp* 三件套（E5），不能把 @deepseek-ai@0.2.2-rc.3 的母体变体直接装进 fork。
# fs-local / subprocess-local / working-directory 已由加速核自带并挂载（无需在 patch 重复插入）。
#
# 语义：fork-local 的 LSP 跑在分身自己的 workspace/worktree，**不经过契约委托**；
# 能力目录以 provider:'fork-local'（mode=local）区分。**安装默认关闭**，启用属于后续增强。
# 语言服务器来源已单独决策：bundle 依赖 npm typescript-language-server@6.1.0 + typescript@5.9.3。
- insert:
    - id: fang-lsp-fork-seam
      name: '@twinsearth/dsh-lsp'
    - id: fang-lsp-fork-stdio
      name: '@twinsearth/dsh-lsp-stdio'
      config:
        servers:
          typescript:
            command: typescript-language-server
            args:
              - '--stdio'
            extensionToLanguage:
              '.ts': typescript
              '.tsx': typescriptreact
              '.js': javascript
              '.jsx': javascriptreact
    - id: fang-lsp-fork-tool
      name: '@twinsearth/dsh-tool-lsp'
