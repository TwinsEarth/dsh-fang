# dsh-Fang v1.0.0 — bundle layer.
# One installable bundle; one loader row per plugin. The row order is a dependency
# order: auditor/forker/buffer feed the middle tier, orchestrator comes last.
- insert:
    - id: fang-auditor
      name: '@local/dsh-fang/auditor'
      config:
        dataRoot: ''
        bootSelfCheck: true

    - id: fang-forker
      name: '@local/dsh-fang/forker'
      config:
        cliPath: ''
        profileTemplate: ''
        startTimeoutMs: 60000
        maxForks: 8
        supervise: false
        maxRestarts: 3
        backoffBaseMs: 1000
        backoffMaxMs: 30000
        backoffJitter: 0.2
        healthPath: /

    - id: fang-buffer-keeper
      name: '@local/dsh-fang/buffer-keeper'
      config:
        root: ''
        settleMs: 750
        pollMs: 250

    - id: fang-scorer
      name: '@local/dsh-fang/scorer'
      config:
        allowlist: []

    - id: fang-umbrella
      name: '@local/dsh-fang/umbrella'
      config:
        bufferRoot: ''
        productionRoot: ''
        allowPaths: []
        networkAllowlist: []
        credentialPatterns: []
        destructivePatterns: []
        lifecyclePatterns: []
        lifecycleTools: []
        gradeFloorTable: umbrella
        cacheSize: 200
        auditDecisions: true

    - id: fang-healer
      name: '@local/dsh-fang/healer'
      config:
        blockingOnUnknown: true
        reservedIds: []

    - id: fang-router
      name: '@local/dsh-fang/router'
      config:
        containerAvailable: false
        trustedPlugins: []

    - id: fang-approver
      name: '@local/dsh-fang/approver'
      config:
        defaultTtlMs: 300000
        remindAt: 0.5
        authMode: manual
        strictRedLine: true
        backupRoot: ''

    - id: fang-hot-reloader
      name: '@local/dsh-fang/hot-reloader'
      config:
        healthWindowMs: 300
        healthMaxNewHandles: 2
        requireApprovalForSwap: true

    - id: fang-restart-guard
      name: '@local/dsh-fang/restart-guard'
      config:
        mode: observe
        authMode: manual
        strictRedLine: true
        allowProcessRestart: false
        autoPromoteAfterHours: 24

    - id: fang-adapter
      name: '@local/dsh-fang/adapter'
      config:
        prefix: /fang
        taskId: ''
        auditLimit: 500
        commandTimeoutMs: 10000

    - id: fang-session-catalog
      name: '@local/dsh-fang/session-catalog'
      config:
        limit: 50
        allowArchived: false
        previewMaxChars: 2000

    - id: fang-session-bridge
      name: '@local/dsh-fang/session-bridge'
      config:
        dshHome: ""
        prefix: /fang
        timeoutMs: 15000

    - id: fang-session-sync
      name: '@local/dsh-fang/session-sync'
      config:
        sessionsRoot: ""
        bundleRoot: ""
        maxBundleBytes: 536870912

    - id: fang-session-router
      name: '@local/dsh-fang/session-router'
      config:
        sameMachine: true
        bridgeEnabled: true
        needsRealtime: false

    - id: fang-orchestrator
      name: '@local/dsh-fang'
      config:
        role: mother
        maxForks: 8
        autoReapIdleMinutes: 0
        routes:
          enabled: true
          prefix: /fang

    # Child plugins of the fang bundle: both are client halves only. They appear
    # under the fang bundle row instead of as separate top-level plugins.
    - id: fang-web-entry
      name: '@twinsearth/dsh-fang-web-entry'

    - id: fang-queue-journal
      name: '@twinsearth/dsh-fang-queue-journal'
