# dsh-Fang v1.0.0 — bundle layer.
# One installable bundle; one loader row per plugin. The row order is a dependency
# order: auditor/forker/buffer feed the middle tier, orchestrator comes last.
- insert:
    - id: fang-auditor
      name: '@twinsearth/fang-dsh-plugin/auditor'
      config:
        dataRoot: ''
        bootSelfCheck: true

    - id: fang-forker
      name: '@twinsearth/fang-dsh-plugin/forker'
      config:
        cliPath: ''
        profileTemplate: ''
        startTimeoutMs: 60000
        maxForks: 8
        supervise: false
        maxRestarts: 3
        backoffBaseMs: 1000
        backoffMaxMs: 30000
        backoffJitter: 0.2
        healthPath: /

    - id: fang-buffer-keeper
      name: '@twinsearth/fang-dsh-plugin/buffer-keeper'
      config:
        root: ''
        settleMs: 750
        pollMs: 250

    - id: fang-scorer
      name: '@twinsearth/fang-dsh-plugin/scorer'
      config:
        allowlist: []

    - id: fang-umbrella
      name: '@twinsearth/fang-dsh-plugin/umbrella'
      config:
        bufferRoot: ''
        productionRoot: ''
        allowPaths: []
        networkAllowlist: []
        credentialPatterns: []
        destructivePatterns: []
        lifecyclePatterns: []
        lifecycleTools: []
        gradeFloorTable: umbrella
        cacheSize: 200
        auditDecisions: true

    - id: fang-healer
      name: '@twinsearth/fang-dsh-plugin/healer'
      config:
        blockingOnUnknown: true
        reservedIds: []

    - id: fang-router
      name: '@twinsearth/fang-dsh-plugin/router'
      config:
        containerAvailable: false
        trustedPlugins: []

    - id: fang-approver
      name: '@twinsearth/fang-dsh-plugin/approver'
      config:
        defaultTtlMs: 300000
        remindAt: 0.5
        authMode: manual
        strictRedLine: true
        backupRoot: ''

    - id: fang-hot-reloader
      name: '@twinsearth/fang-dsh-plugin/hot-reloader'
      config:
        healthWindowMs: 300
        healthMaxNewHandles: 2
        requireApprovalForSwap: true

    - id: fang-restart-guard
      name: '@twinsearth/fang-dsh-plugin/restart-guard'
      config:
        mode: enforce
        authMode: manual
        strictRedLine: true
        allowProcessRestart: true
        autoWatchdog: true
        autoPromoteAfterHours: 24

    - id: fang-adapter
      name: '@twinsearth/fang-dsh-plugin/adapter'
      config:
        prefix: /fang
        taskId: ''
        auditLimit: 500
        commandTimeoutMs: 10000

    - id: fang-session-catalog
      name: '@twinsearth/fang-dsh-plugin/session-catalog'
      config:
        limit: 50
        allowArchived: true
        previewMaxChars: 2000

    - id: fang-session-bridge
      name: '@twinsearth/fang-dsh-plugin/session-bridge'
      config:
        dshHome: ""
        prefix: /fang
        timeoutMs: 15000

    - id: fang-session-sync
      name: '@twinsearth/fang-dsh-plugin/session-sync'
      config:
        sessionsRoot: ""
        bundleRoot: ""
        maxBundleBytes: 536870912

    - id: fang-session-router
      name: '@twinsearth/fang-dsh-plugin/session-router'
      config:
        sameMachine: true
        bridgeEnabled: true
        needsRealtime: false

    - id: fang-decision-center
      name: '@twinsearth/fang-dsh-plugin/decision-center'
      config:
        maxTickets: 500
        maxPendingRed: 30
        defaultTimeoutMinutes: 360
        tickMs: 5000
        registerTool: true

    - id: fang-orchestrator
      name: '@twinsearth/fang-dsh-plugin'
      config:
        role: mother
        maxForks: 8
        autoReapIdleMinutes: 0
        routes:
          enabled: true
          prefix: /fang
        contract:
          enabled: true
          token: ''
          fileDir: ''
          pathPrefix: /fang/api/contract

    # Child plugin of the fang bundle: composer draft/queue journal (client half).
    # The main Web panel is the fang client half itself (package.json dsh.client),
    # so the plugin is fully usable without the PC Electron client.
    - id: fang-web-entry
      name: '@twinsearth/dsh-fang-web-entry'

    # v3.3.3: default OFF. Draft/queue recovery is optional; the host half
    # provides fangQueueJournal only when this row is enabled, and without it
    # the orchestrator returns 503 queue-journal-disabled for journal/queue
    # routes. The client half is not loaded, so its composer UI stays hidden.
    - id: fang-queue-journal
      name: '@twinsearth/dsh-fang-queue-journal'
      disabled: true
